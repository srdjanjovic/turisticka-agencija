services:
  neo4j-nais:
    image: neo4j
    container_name: neo4j-nais
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - nais_data:/data
    networks:
      - nais-network

  dodatne-aktivnosti-service:
    build:
      context: ./dodatne-aktivnosti
      dockerfile: Dockerfile
    container_name: dodatne-aktivnosti-service
    ports:
      - "8080:8080"
    depends_on:
      - neo4j-nais
    environment:
      SPRING_NEO4J_URI: bolt://neo4j-nais:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password
    networks:
      - nais-network

volumes:
  nais_data:

networks:
  nais-network: