version: '3'

services:
  neo4j-nais:
    image: neo4j
    container_name: neo4j-nais
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - nais_data:/data
    networks:
      - nais-network

volumes:
  nais_data:

networks:
  nais-network: